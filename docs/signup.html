<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規登録 - Book Logger</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="login.html"><i class="bi bi-book"></i> Book Logger</a>
  </div>
</nav>

<div class="auth-container">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h3 class="text-center mb-4">新規登録</h3>
      <form>
        <div class="mb-3">
          <label class="form-label">ユーザー名</label>
          <input type="text" class="form-control" placeholder="ユーザー名">
        </div>
        <div class="mb-3">
          <label class="form-label">メールアドレス</label>
          <input type="email" class="form-control" placeholder="user@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">パスワード</label>
          <input type="password" class="form-control" placeholder="6文字以上">
          <div class="form-text">6文字以上で入力してください</div>
        </div>
        <div class="mb-3">
          <label class="form-label">パスワード（確認）</label>
          <input type="password" class="form-control" placeholder="パスワードを再入力">
        </div>
        <a href="index.html" class="btn btn-primary w-100 mb-3">アカウント作成</a>
        <div class="text-center">
          <a href="login.html" class="text-decoration-none">すでにアカウントをお持ちの方はこちら</a>
        </div>
      </form>
    </div>
  </div>
</div>

<footer class="bg-dark text-light py-3 mt-5">
  <div class="container text-center">
    <small>&copy; 2026 Book Logger. All rights reserved.</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
