<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>書籍編集 - Book Logger</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-book"></i> Book Logger</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="index.html">書籍一覧</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="book_new.html">書籍登録</a>
        </li>
      </ul>
      <div class="d-flex align-items-center">
        <span class="text-light me-3"><i class="bi bi-person-circle"></i> テストユーザー</span>
        <a href="login.html" class="btn btn-outline-light btn-sm">ログアウト</a>
      </div>
    </div>
  </div>
</nav>

<div class="container my-4">

  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="index.html">書籍一覧</a></li>
      <li class="breadcrumb-item"><a href="book_detail.html">リーダブルコード</a></li>
      <li class="breadcrumb-item active">編集</li>
    </ol>
  </nav>

  <h2 class="mb-4">書籍を編集</h2>

  <div class="card">
    <div class="card-body">
      <form>
        <div class="mb-3">
          <label class="form-label">タイトル <span class="text-danger">*</span></label>
          <input type="text" class="form-control" value="リーダブルコード">
        </div>

        <div class="mb-3">
          <label class="form-label">著者 <span class="text-danger">*</span></label>
          <input type="text" class="form-control" value="Dustin Boswell, Trevor Foucher">
          <div class="form-text">複数名の場合はカンマ区切りで入力</div>
        </div>

        <div class="mb-3">
          <label class="form-label">説明</label>
          <textarea class="form-control" rows="4">より良いコードを書くためのシンプルで実践的なテクニックを紹介する名著。変数名の付け方からコメントの書き方、コードの整理方法まで幅広くカバーしている。プログラミング初心者から上級者まで、すべての開発者に読んでほしい一冊。</textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">タグ</label>
          <div class="d-flex flex-wrap gap-2">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="Ruby" id="tag-ruby" checked>
              <label class="form-check-label" for="tag-ruby">Ruby</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="設計" id="tag-design" checked>
              <label class="form-check-label" for="tag-design">設計</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="小説" id="tag-novel">
              <label class="form-check-label" for="tag-novel">小説</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="ビジネス" id="tag-business">
              <label class="form-check-label" for="tag-business">ビジネス</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="自己啓発" id="tag-selfhelp">
              <label class="form-check-label" for="tag-selfhelp">自己啓発</label>
            </div>
          </div>
        </div>

        <hr>
        <div class="d-flex gap-2">
          <a href="book_detail.html" class="btn btn-primary"><i class="bi bi-check-lg"></i> 更新する</a>
          <a href="book_detail.html" class="btn btn-outline-secondary">キャンセル</a>
        </div>
      </form>
    </div>
  </div>

</div>

<footer class="bg-dark text-light py-3 mt-5">
  <div class="container text-center">
    <small>&copy; 2026 Book Logger. All rights reserved.</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
