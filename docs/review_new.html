<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レビュー投稿 - Book Logger</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-book"></i> Book Logger</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="index.html">書籍一覧</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="book_new.html">書籍登録</a>
        </li>
      </ul>
      <div class="d-flex align-items-center">
        <span class="text-light me-3"><i class="bi bi-person-circle"></i> テストユーザー</span>
        <a href="login.html" class="btn btn-outline-light btn-sm">ログアウト</a>
      </div>
    </div>
  </div>
</nav>

<div class="container my-4">

  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="index.html">書籍一覧</a></li>
      <li class="breadcrumb-item"><a href="book_detail.html">リーダブルコード</a></li>
      <li class="breadcrumb-item active">レビュー投稿</li>
    </ol>
  </nav>

  <h2 class="mb-4">レビューを投稿</h2>

  <div class="card mb-3">
    <div class="card-body bg-light">
      <h5 class="mb-1">リーダブルコード</h5>
      <p class="text-muted mb-0"><i class="bi bi-person"></i> Dustin Boswell, Trevor Foucher</p>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <form>
        <div class="mb-3">
          <label class="form-label">評価 <span class="text-danger">*</span></label>
          <div class="d-flex gap-1">
            <button type="button" class="btn btn-outline-warning" onclick="this.classList.add('active')"><i class="bi bi-star-fill"></i></button>
            <button type="button" class="btn btn-outline-warning" onclick="this.classList.add('active')"><i class="bi bi-star-fill"></i></button>
            <button type="button" class="btn btn-outline-warning" onclick="this.classList.add('active')"><i class="bi bi-star-fill"></i></button>
            <button type="button" class="btn btn-outline-warning active"><i class="bi bi-star-fill"></i></button>
            <button type="button" class="btn btn-outline-warning"><i class="bi bi-star-fill"></i></button>
          </div>
          <div class="form-text">1〜5の評価を選択してください</div>
        </div>

        <div class="mb-3">
          <label class="form-label">タイトル <span class="text-danger">*</span></label>
          <input type="text" class="form-control" placeholder="例: 実践的で読みやすい">
        </div>

        <div class="mb-3">
          <label class="form-label">本文 <span class="text-danger">*</span></label>
          <textarea class="form-control" rows="6" placeholder="レビュー本文を入力してください..."></textarea>
        </div>

        <hr>
        <div class="d-flex gap-2">
          <a href="book_detail.html" class="btn btn-success"><i class="bi bi-check-lg"></i> 投稿する</a>
          <a href="book_detail.html" class="btn btn-outline-secondary">キャンセル</a>
        </div>
      </form>
    </div>
  </div>

</div>

<footer class="bg-dark text-light py-3 mt-5">
  <div class="container text-center">
    <small>&copy; 2026 Book Logger. All rights reserved.</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
